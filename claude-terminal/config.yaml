---
name: "Claude Terminal Pro"
description: "Enhanced terminal interface for Anthropic's Claude Code CLI with persistent auth, package management, and image paste support. Fork of heytcass/home-assistant-addons"
version: "2.1.0"
slug: "claude_terminal_pro"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64
  - armv7

# External resources
url: "https://github.com/esjavadex/claude-code-ha"

# Web interface configuration
ingress: true
ingress_port: 7680
panel_icon: mdi:code-braces-box
panel_title: "Claude Terminal Pro"
panel_admin: true

# Port configuration
#
# No host ports are published. The add-on is reached exclusively through Home
# Assistant ingress, which enforces HA authentication.
#
# Publishing these ports would expose an unauthenticated, writable root shell
# (ttyd runs with --writable and no credentials) inside a container that holds
# /config read-write, the Supervisor manager role and SUPERVISOR_TOKEN. Ingress
# reaches the container over the internal Docker network and does not require a
# host port mapping, so there is nothing to gain and a full host takeover to
# lose. ttyd itself now binds to 127.0.0.1 and is only reachable through the
# ingress web interface on port 7680.

# Add-on configuration options
options:
  auto_launch_claude: true
  tmux_mouse: false
  dangerously_skip_permissions: false
  persistent_apk_packages: []
  persistent_pip_packages: []
  use_persistent_claude: false
  auto_update_claude_on_start: false

schema:
  auto_launch_claude: bool?
  tmux_mouse: bool?
  dangerously_skip_permissions: bool?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  use_persistent_claude: bool?
  auto_update_claude_on_start: bool?

# Volume mappings for file access
map:
  - config:rw    # Access to Home Assistant configuration files

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services
